name: Build Android APK

on:
  push:
    branches: ["arena/01a07301-panelhoshmand"]
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "offline.html"
      - "icons/**"
      - "assets/**"
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Bundle web files into assets
        run: |
          mkdir -p android/app/src/main/assets/www/icons
          cp index.html offline.html manifest.webmanifest service-worker.js android/app/src/main/assets/www/
          cp icons/icon-192.png icons/icon-512.png icons/maskable-512.png icons/apple-touch-icon.png icons/favicon-32.png icons/favicon.ico android/app/src/main/assets/www/icons/
          ls -la android/app/src/main/assets/www android/app/src/main/assets/www/icons

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          ./gradle-8.7/bin/gradle --version

      - name: Build debug APK
        working-directory: android
        run: ../gradle-8.7/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MeelanoPanel.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeelanoPanel-apk
          path: MeelanoPanel.apk
          if-no-files-found: error

      - name: Commit APK into releases folder
        run: |
          mkdir -p releases
          cp MeelanoPanel.apk releases/MeelanoPanel.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/MeelanoPanel.apk
          if git diff --cached --quiet; then
            echo "APK unchanged, nothing to commit."
          else
            git commit -m "انتشار خودکار MeelanoPanel.apk (ساخت شماره $GITHUB_RUN_NUMBER)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
